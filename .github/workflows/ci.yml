name: CI
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npx expo export --platform web
        env:
          EXPO_PUBLIC_POCKETBASE_URL: ${{ vars.EXPO_PUBLIC_POCKETBASE_URL || 'http://localhost:8090' }}
  secrets-scan:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v3
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: Start PocketBase with the repo migrations and hooks
        run: |
          docker volume create pbdata
          docker run --rm -v pbdata:/pb_data ghcr.io/muchobien/pocketbase:latest             superuser upsert ci-admin@example.com Ci-admin-password-123 --dir=/pb_data
          docker run -d --name pb -p 8090:8090 -v pbdata:/pb_data             -v "$PWD/pocketbase/pb_migrations:/pb_migrations"             -v "$PWD/pocketbase/pb_hooks:/pb_hooks"             ghcr.io/muchobien/pocketbase:latest             --dir=/pb_data --migrationsDir=/pb_migrations --hooksDir=/pb_hooks
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8090/api/health && exit 0
            sleep 2
          done
          docker logs pb
          exit 1
      - run: npm run test:rules
        env:
          PB_URL: "http://127.0.0.1:8090"
          PB_SUPERUSER_EMAIL: ci-admin@example.com
          PB_SUPERUSER_PASSWORD: Ci-admin-password-123
      - if: failure()
        run: docker logs pb
