services:
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: pocketbase_inwentarz
    restart: unless-stopped
    # Tylko localhost - na zewnatrz wystawia go Tailscale Serve (HTTPS).
    # Port 8090 jest wewnetrzny; sprawdz `tailscale serve status` zanim wybierzesz port HTTPS.
    ports:
      - '127.0.0.1:8090:8090'
    volumes:
      - ./pb_data:/pb_data
      - ./pb_migrations:/pb_migrations
      - ./pb_hooks:/pb_hooks
    command: ['--dir=/pb_data', '--migrationsDir=/pb_migrations', '--hooksDir=/pb_hooks', '--publicDir=/pb_public']
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8090/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
