services:
  inwentarz-domowy:
    build: .
    container_name: inwentarz_domowy
    restart: unless-stopped
    # Port 8088 tylko na localhost; wystaw go przez HTTPS (reverse proxy lub Tailscale Serve).
    # Nie wystawiaj bez HTTPS (reverse proxy lub Tailscale Serve).
    ports:
      - '127.0.0.1:8088:80'
