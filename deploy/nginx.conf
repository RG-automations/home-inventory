server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Kompresja — bundle ma ~3 MB, bez tego ladowanie przez telefon bedzie wolne.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Pliki z hashem w nazwie (bundle JS) sa niezmienne — mozna cache'owac na dlugo.
    location /_expo/ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Ikony BEZ dlugiego cache: przy zmianie logo iOS trzymalby stara ikone
    # przez caly okres waznosci (nawet po usunieciu i ponownym dodaniu PWA
    # na ekran glowny). "no-cache" pozwala uzyc kopii lokalnej, ale dopiero
    # po sprawdzeniu u serwera, czy plik sie nie zmienil (przez ETag).
    location /icons/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    location = /favicon.ico {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Manifest i index.html NIE moga byc cache'owane na dlugo,
    # inaczej po aktualizacji aplikacji telefon zostanie ze stara wersja.
    location = /manifest.json {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Aplikacja jest SPA — kazda sciezka (np. /location/abc123) musi
    # zwrocic index.html, inaczej wejscie z zakladki da blad 404.
    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
