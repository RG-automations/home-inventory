<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover — pelny ekran na iPhone z wcieciem (notch) -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />

    <title>Inwentarz Domowy</title>

    <!-- PWA: manifest + ikony -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.ico" />
    <!-- Nazwy ikon zawieraja wersje (-v2): przy zmianie logo wystarczy
         podbic numer, zeby iOS pobral nowa ikone zamiast siegac po cache. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-v2.png" />

    <!-- iOS nie czyta manifestu — potrzebuje wlasnych meta tagow,
         zeby aplikacja uruchamiala sie bez paska przegladarki. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Inwentarz" />
    <meta name="mobile-web-app-capable" content="yes" />

    <meta name="theme-color" content="#2563eb" />
    <meta name="description" content="Wiesz gdzie trzymasz swoje rzeczy" />

    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>Aby korzystać z aplikacji, włącz obsługę JavaScript.</noscript>
    <div id="root"></div>
  </body>
</html>
